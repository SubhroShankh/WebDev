<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/action">
        <div>
            <label for="username">Username: </label>
            <input type="text" placeholder="enter username" id="username" name="user">
        
        </div>
        <div>
            <label for="password">password: </label>
            <input type="password" placeholder="enter password" id="password" name="pass">
    
        </div>
        <button>submit</button>
        <button type="submit">submit btn</button>
        <button type="button">simple btn</button>
        <button type="reset">reset</button>
        <br>
        <!-- creating button by input -->
        <input type="button" value="click me">
        <input type="submit" value="click me b2" >
    </form>
    <form action="https://www.youtube.com/results">
        <br>
        <input type="text" placeholder="search in youtube" name="search_query">
        <button type="submit">search</button>
        <div>
            <Input type="radio"  name="fruit" id="apple" value="apple">
            <label for="apple">Apple</label>
            <input type="radio" name="fruit" id="mango" value="mango">
            <label for="mango">mango</label>
            <input type="radio" name="fruit" id="banana" value="banana">
            <label for="banana">banana</label> 
        </div>
        <div>
            choose your profession
            <select name="profession" id="profession">
                <option value="stu">student</option>
                <option value="dev">developer</option>
            </select>
        </div>
        <div>
            <label for="vol">select your volume level: </label>
            <input type="range" min="1" max="100" name="range">
        </div>
        <br>
        <textarea id="feedback"></textarea>
        <label for="feedback"></label>
        <button>submit</button>
    </form>
    
</body>
</html>
