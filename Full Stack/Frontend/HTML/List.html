<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in html</title>
</head>
<body>
    <!-- unordered list -->
    <ul>  
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam</li>
    </ul>
    <!-- ordered list -->
    <ol>  
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam</li>
    </ol>
    <ol type="A"> 
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam</li>
    </ol>
    <ol type="a">  
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam</li>
    </ol>
</body>
</html>
